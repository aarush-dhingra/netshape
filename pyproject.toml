[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netshape"
version = "1.0.1"
description = "Local throttling proxy for testing apps under degraded network conditions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aarush Dhingra", email = "aarushdhingra27@gmail.com" }
]
keywords = ["network", "proxy", "throttling", "testing", "simulation", "latency", "bandwidth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13",
    "typer>=0.12",
    "psutil>=5.9",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/aarush-dhingra/netshape"
Source = "https://github.com/aarush-dhingra/netshape"
"Bug Tracker" = "https://github.com/aarush-dhingra/netshape/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "bandit>=1.7",
    "pip-audit>=2",
]

[project.scripts]
netshape = "netshape.cli:app"

[tool.setuptools.packages.find]
include = ["netshape*"]

[tool.setuptools.package-data]
netshape = [
    "data/*.json",
    "data/scenarios/*.yaml",
    "dashboard/*.html",
    "dashboard/*.js",
    "dashboard/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.bandit]
skips = []
exclude_dirs = ["tests", "test-app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
